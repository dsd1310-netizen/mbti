<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 구글 폰트 — CSS @import 대신 <link>로 두어 브라우저가 HTML 파싱 중 최대한 일찍
         병렬로 폰트 요청을 시작하게 함(App.css에 있던 @import는 렌더링 차단 + 순차 로드라 늦음). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;700;900&family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
    <title>🔮 나풀이 — 사주 × MBTI 풀이</title>
    <meta name="description" content="절기(節氣) 기준 정밀 만세력으로 사주원국을 산출하고, 나풀이가 MBTI와 융합 분석하는 사주 해석 앱입니다." />
    <link rel="canonical" href="https://mbti-delta-red.vercel.app/" />
    <!-- 소셜 공유 미리보기 — 카카오톡은 자체 SDK(App.tsx handleKakaoShare)로 이미지가 뜨지만,
         그 외(문자메시지/디스코드/트위터 등)로 링크가 공유될 때(예: 궁합 초대 링크)는 이 태그가
         없으면 이미지 없는 텍스트 링크로만 보임. og-image.png는 Vite 해시가 안 붙는 public/ 루트에
         둬서 URL이 항상 고정되도록 함(src/assets는 빌드 시 파일명에 해시가 붙어 정적 meta에서 못 씀). -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mbti-delta-red.vercel.app/" />
    <meta property="og:title" content="나풀이 — 사주 × MBTI 풀이" />
    <meta property="og:description" content="나풀이에서 나만의 사주 × MBTI 심층 분석을 경험해보세요." />
    <meta property="og:image" content="https://mbti-delta-red.vercel.app/og-image.png" />
    <meta property="og:image:width" content="343" />
    <meta property="og:image:height" content="361" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="나풀이 — 사주 × MBTI 풀이" />
    <meta name="twitter:description" content="나풀이에서 나만의 사주 × MBTI 심층 분석을 경험해보세요." />
    <meta name="twitter:image" content="https://mbti-delta-red.vercel.app/og-image.png" />
    <!-- PWA: 앱스토어 없이도 "홈 화면에 추가" + 오프라인 접근이 가능하도록 -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#8b5cf6" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="나풀이" />
    <!-- 카카오톡 공유 SDK는 여기서 미리 로드하지 않음 — async/defer 없는 <script>는 HTML 파싱을
         차단해 모바일 저속 네트워크에서 첫 화면 표시를 수 초씩 늦춤. 실제로 "카톡 공유" 버튼을
         누를 때만 App.tsx의 handleKakaoShare()가 동적으로 script 태그를 주입해 로드한다. -->
    <!-- 지하철 등에서 네트워크가 끊겨 App.css(해시 붙은 외부 파일)조차 못 받아온 경우에도
         아래 #root 대체 콘텐츠가 최소한 읽히도록, 배경/글자색만 별도로 미리 인라인 지정
         (계획안.md 7-AU 참고). -->
    <style>body { background: #050510; color: #f0eeff; margin: 0; }</style>
  </head>
  <body>
    <div id="root">
      <!-- React가 정상적으로 마운트되면 즉시 이 내용으로 덮어써진다. 스크립트/청크 로딩이
           네트워크 문제로 실패해 React가 끝내 못 뜨는 경우, 사용자가 완전히 새까만 빈 화면
           대신 최소한 "새로고침해 달라"는 안내는 보게 하기 위한 정적 대체 콘텐츠. -->
      <div style="min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; text-align:center; padding:24px; font-family:'Noto Sans KR', sans-serif;">
        <div style="font-size:40px;">🔮</div>
        <p style="font-size:14px; color:#94a3b8; max-width:320px; line-height:1.6; margin:0;">
          나풀이를 불러오는 중이에요. 화면이 계속 이 상태라면 네트워크 연결을 확인하고 새로고침해 주세요.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
